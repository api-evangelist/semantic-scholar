- name: snippet_search
  description: "Search for text snippets that most closely match the query.\n\nText snippets are excerpts\
    \ of approximately 500 words, drawn from a paper's title,\nabstract, and body text, but excluding\
    \ figure captions and the bibliography.\nIt will return the highest ranked snippet first, as well\
    \ as some basic data about\nthe paper it was found in.\n\nArgs:\n    query: The query to search for.\n\
    \n    limit: The number of snippets to return. Default is 250.\n\n    venues: Restricts results to\
    \ papers published in the given venues,\n    formatted as a string of comma-separated values. E.g.\
    \ \"Nature,N. Engl. J. Med.\"\n    Default is no venue restriction, represented by an empty string.\n\
    \n    paper_ids: Restricts results to snippets from specific papers.\n    To specify papers, provide\
    \ a comma-separated list of their IDs.\n    You can provide up to 100 IDs.\n    The following types\
    \ of IDs are supported:\n        <sha> - a Semantic Scholar ID, e.g. 649def34f8be52c8b66281af98ae884c09aef38b\n\
    \        CorpusId:<id> - a Semantic Scholar numerical ID, e.g. CorpusId:215416146\n        DOI:<doi>\
    \ - a Digital Object Identifier, e.g. DOI:10.18653/v1/N18-3011\n        ARXIV:<id> - arXiv.rg, e.g.\
    \ ARXIV:2106.15928\n        MAG:<id> - Microsoft Academic Graph, e.g. MAG:112218234\n        ACL:<id>\
    \ - Association for Computational Linguistics, e.g. ACL:W12-3903\n        PMID:<id> - PubMed/Medline,\
    \ e.g. PMID:19872477\n        PMCID:<id> - PubMed Central, e.g. PMCID:2323736\n        URL:<url> -\
    \ URL from one of the sites listed below, e.g. URL:https://arxiv.org/abs/2106.15928v1\n    URLs are\
    \ recognized from the following sites: semanticscholar.org, arxiv.org, aclweb.org, acm.org, biorxiv.org\n\
    \n    inserted_before: Restricts results to snippets from papers inserted before the provided date\n\
    \    (excludes things inserted on the provided date). Acceptable formats: YYYY-MM-DD, YYYY-MM, YYYY\n\
    \nReturns:\n    The snippet search results."
