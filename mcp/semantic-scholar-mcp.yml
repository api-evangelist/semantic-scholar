tools:
- name: get_paper
  description: "Get details about a paper by its id.\n\nArgs:\n    paper_id: The id of the paper to get.\
    \ The following types of IDs are supported:\n        <sha> - a Semantic Scholar ID, e.g. 649def34f8be52c8b66281af98ae884c09aef38b\n\
    \        CorpusId:<id> - a Semantic Scholar numerical ID, e.g. CorpusId:215416146\n        DOI:<doi>\
    \ - a Digital Object Identifier, e.g. DOI:10.18653/v1/N18-3011\n        ARXIV:<id> - arXiv.rg, e.g.\
    \ ARXIV:2106.15928\n        MAG:<id> - Microsoft Academic Graph, e.g. MAG:112218234\n        ACL:<id>\
    \ - Association for Computational Linguistics, e.g. ACL:W12-3903\n        PMID:<id> - PubMed/Medline,\
    \ e.g. PMID:19872477\n        PMCID:<id> - PubMed Central, e.g. PMCID:2323736\n        URL:<url> -\
    \ URL from one of the sites listed below, e.g. URL:https://arxiv.org/abs/2106.15928v1\n\n    fields:\
    \ String of comma-separated fields to include in the response. E.g \"url,year,authors\".\n    Default\
    \ is \"title\". Available fields are: abstract, authors, citations, fieldsOfStudy, isOpenAccess,\n\
    \    journal, publicationDate, references, tldr, url, venue, year.\n\nReturns:\n    The paper object."
- name: get_paper_batch
  description: "Get details about a list of papers by their ids.\n\nArgs:\n    ids: The paper ids to get.\
    \ The following types of IDs are supported:\n        <sha> - a Semantic Scholar ID, e.g. 649def34f8be52c8b66281af98ae884c09aef38b\n\
    \        CorpusId:<id> - a Semantic Scholar numerical ID, e.g. CorpusId:215416146\n        DOI:<doi>\
    \ - a Digital Object Identifier, e.g. DOI:10.18653/v1/N18-3011\n        ARXIV:<id> - arXiv.rg, e.g.\
    \ ARXIV:2106.15928\n        MAG:<id> - Microsoft Academic Graph, e.g. MAG:112218234\n        ACL:<id>\
    \ - Association for Computational Linguistics, e.g. ACL:W12-3903\n        PMID:<id> - PubMed/Medline,\
    \ e.g. PMID:19872477\n        PMCID:<id> - PubMed Central, e.g. PMCID:2323736\n        URL:<url> -\
    \ URL from one of the sites listed below, e.g. URL:https://arxiv.org/abs/2106.15928v1\n\n    fields:\
    \ String of comma-separated fields to include in the response. E.g \"url,year,authors\".\n    Default\
    \ is \"title\". Available fields are: abstract, authors, citations, fieldsOfStudy, isOpenAccess,\n\
    \    journal, publicationDate, references, tldr, url, venue, year.\n\nReturns:\n    The paper object."
- name: get_citations
  description: "Get details about the papers that cite this paper (i.e. papers in whose bibliography this\
    \ paper appears)\n\nArgs:\n    paper_id: The id of the paper to get. The following types of IDs are\
    \ supported:\n        <sha> - a Semantic Scholar ID, e.g. 649def34f8be52c8b66281af98ae884c09aef38b\n\
    \        CorpusId:<id> - a Semantic Scholar numerical ID, e.g. CorpusId:215416146\n        DOI:<doi>\
    \ - a Digital Object Identifier, e.g. DOI:10.18653/v1/N18-3011\n        ARXIV:<id> - arXiv.rg, e.g.\
    \ ARXIV:2106.15928\n        MAG:<id> - Microsoft Academic Graph, e.g. MAG:112218234\n        ACL:<id>\
    \ - Association for Computational Linguistics, e.g. ACL:W12-3903\n        PMID:<id> - PubMed/Medline,\
    \ e.g. PMID:19872477\n        PMCID:<id> - PubMed Central, e.g. PMCID:2323736\n        URL:<url> -\
    \ URL from one of the sites listed below, e.g. URL:https://arxiv.org/abs/2106.15928v1\n\n    fields:\
    \ String of comma-separated fields to include in the response. E.g \"url,year,authors\".\n    Default\
    \ is \"title\". Available fields are: abstract, authors, citations, fieldsOfStudy, isOpenAccess,\n\
    \    journal, publicationDate, references, tldr, url, venue, year.\n\n    limit: The number of papers\
    \ to return. Default is 100.\n\n    publication_date_range: Restricts results to the given range of\
    \ publication dates or years (inclusive).\n    Accepts the format <startDate>:<endDate> with each\
    \ date in YYYY-MM-DD format.\n    Each term is optional, allowing for specific dates, fixed ranges,\
    \ or open-ended ranges.\n    In addition, prefixes are supported as a shorthand, e.g. 2020-06 matches\
    \ all dates in June 2020.\n    Specific dates are not known for all papers, so some records returned\
    \ with this filter\n    will have a null value for publicationDate. year, however, will always be\
    \ present.\n    For records where a specific publication date is not known, they will be treated\n\
    \    as if published on January 1st of their publication year.\n    Examples:\n        2019-03-05\
    \ on March 5th, 2019\n        2019-03 during March 2019\n        2019 during 2019\n        2016-03-05:2020-06-06\
    \ as early as March 5th, 2016 or as late as June 6th, 2020\n        1981-08-25: on or after August\
    \ 25th, 1981\n        :2015-01 before or on January 31st, 2015\n        2015:2020 between January\
    \ 1st, 2015 and December 31st, 2020\n\nReturns:\n    The paper object."
- name: search_authors_by_name
  description: "Search for authors by name.\n\nArgs:\n    name: The name to search for.\n\n    fields:\
    \ String of comma-separated fields to include in the response. E.g \"name,url,papers\".\n    The \"\
    authorId\" field is always returned. Default is \"name\". Other available fields are:\n        - externalIds:\
    \ An object that contains the ORCID/DBLP IDs for the author, if known\n        - url: URL of the author\
    \ on the Semantic Scholar website\n        - affiliations: Array of organizational affiliations for\
    \ the author\n        - homepage: The author's homepage\n        - paperCount: The author's total\
    \ publications count\n        - citationCount: The author's total citations count\n        - hIndex:\
    \ The author's h-index\n        - papers: Array of paper objects\n\n    limit: The number of authors\
    \ to return. Default is 100.\n\nReturns:\n    The author object."
